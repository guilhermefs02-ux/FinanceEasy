{% extends "base.html" %}
{% block title %}Editar lançamento — FinanceEasy{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <h1 class="h5 fw-bold mb-3">Editar lançamento</h1>
    <div class="fe-card">
      <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            {{ field.label_tag }}
            {{ field }}
            {% for erro in field.errors %}<div class="text-danger small mt-1">{{ erro }}</div>{% endfor %}
          </div>
        {% endfor %}
        <button type="submit" class="btn fe-btn-primary w-100 py-2">Salvar alterações</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
