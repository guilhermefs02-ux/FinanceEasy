{% extends "base.html" %}
{% block title %}Confirmar Exclusão — FinanceEasy{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-5">
    <div class="fe-card text-center py-4">
      <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
      <h1 class="h5 fw-bold mt-2">Excluir Dívida?</h1>
      <p class="text-muted small">
        Tem certeza que deseja remover a dívida com <strong>{{ divida.credor }}</strong>? Esta ação não pode ser desfeita.
      </p>

      <form method="post" class="d-flex justify-content-center gap-2 mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger fw-bold px-4">Sim, excluir</button>
        <a href="{% url 'debts:lista' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
